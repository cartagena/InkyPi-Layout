# Lint configuration, deliberately explicit rather than relying on ruff's
# built-in defaults.
#
# Those defaults are not stable across releases: ruff 0.16 enabled a much
# broader set than 0.15, which turned CI red on code that had not changed.
# Pinning the rule selection here — and the ruff version in
# .github/workflows/ci.yml — means a lint failure always reflects a real
# change in this repository, never an upgrade in the linter.
target-version = "py311"

[lint]
# pycodestyle errors, pyflakes, import sorting, pyupgrade, bugbear, simplify.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[lint.isort]
# `plugins` and `utils` are InkyPi's own modules, resolved from the host app
# at runtime rather than installed from PyPI. Grouping them separately from
# real third-party packages keeps "what this plugin imports from its host"
# visually distinct — which is how these files were already written.
known-first-party = ["plugins", "utils"]
