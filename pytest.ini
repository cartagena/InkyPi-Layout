[pytest]
# Two suites, deliberately separated:
#   tests/unit         — runs anywhere, no InkyPi, no network. This is the
#                        default for a bare `pytest` and the gate for every PR.
#   tests/integration  — needs a real InkyPi checkout via $INKYPI_PATH; skipped
#                        (not failed) when that isn't configured.
testpaths = tests
addopts = -ra --strict-markers
markers =
    integration: requires a real InkyPi checkout ($INKYPI_PATH)
